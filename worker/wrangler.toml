# Конфигурация Cloudflare Worker, принимающего оплату.
#
# Секретов здесь нет и быть не должно: YOOKASSA_SECRET_KEY и
# TELEGRAM_BOT_TOKEN задаются в панели Cloudflare как Secret и в файл
# не попадают. См. worker/README.md.

# Имя должно совпадать с именем Worker'а в Cloudflare: wrangler
# разворачивает Worker по этому имени, и при расхождении завёл бы второй —
# пустой, без заданных в панели секретов. Переименовать Worker в Cloudflare
# нельзя, только пересоздать, поэтому подстраиваемся здесь.
name = "tg-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Логика общая с серверным чекаутом: worker/src импортирует модули из
# checkout/src, написанные для Node. Флаг даёт им привычное окружение.
compatibility_flags = ["nodejs_compat"]

# Служебный адрес вида hollvpn-checkout.<ваш>.workers.dev. Нужен, чтобы
# проверить Worker до того, как домен заведён в Cloudflare. Когда всё
# заработает на своём домене, можно поставить false.
workers_dev = true

# Worker отвечает только на /api/*. Всё остальное на домене отдаёт
# GitHub Pages, как и раньше.
#
# ↓ Раскомментируйте ПОСЛЕ того, как hollvpn.ru заведён в Cloudflare.
#   До этого wrangler откажется разворачивать: зоны ещё нет, и маршрут
#   привязать не к чему.
#
# [[routes]]
# pattern = "hollvpn.ru/api/*"
# zone_name = "hollvpn.ru"

[[d1_databases]]
binding = "DB"
database_name = "hollvpn-orders"
# Идентификатор базы, а не секрет: он просто адресует её в аккаунте.
database_id = "88cf0b97-a910-4810-8fe4-3dfae3eef30a"

[vars]
# Адрес сайта: из него собирается return_url после оплаты и он же
# единственный источник, которому открыт CORS.
PUBLIC_URL = "https://hollvpn.ru"

# Проверять, что уведомление пришло с адресов ЮKassa. Выключать только
# при отладке.
VERIFY_WEBHOOK_IP = "true"

# Куда сообщить об оплате, чтобы выдать доступ. Нужен хотя бы один способ,
# иначе Worker отвечает 503 и денег не берёт:
#   FULFILMENT_URL — эндпоинт бота, выдаёт подписку сам
#   TELEGRAM_BOT_TOKEN + TELEGRAM_ADMIN_CHAT_ID — сообщение вам, выдаёте руками
# FULFILMENT_URL = "https://ваш-бот/fulfil"
# TELEGRAM_ADMIN_CHAT_ID = "ваш-id"
