# Публикация сайта на GitHub Pages.
#
# Сайт — статика без сборки: каталог site/ выкладывается как есть.
# Перед выкладкой прогоняется scripts/check-site.sh; он же запускается
# на pull request, чтобы сломанное не доезжало до main.
#
# Чтобы это заработало, в репозитории нужно один раз включить
# Settings → Pages → Source: GitHub Actions.

name: Сайт

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check-site.sh'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/check-site.sh'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# Публикация одна на репозиторий: параллельные выкладки не нужны,
# но и обрывать начатую нельзя — иначе Pages останется в промежуточном виде.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Проверка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сайт не тянет ничего извне, ссылки не битые
        run: bash scripts/check-site.sh

  deploy:
    name: Публикация
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages включается один раз руками, и это единственное, чего нельзя
      # сделать отсюда: создание сайта Pages требует прав администратора
      # репозитория, которых у токена воркфлоу нет (enablement: true
      # отвечает «Resource not accessible by integration»). Проверяем
      # заранее, чтобы вместо невнятной ошибки было сказано, что нажать.
      - name: Проверяю, включён ли Pages
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages не включён. Settings → Pages → Source: GitHub Actions, затем перезапустите этот прогон."
            exit 1
          fi
          echo "Pages включён (ответ $code)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      # Проверяем сам домен, а не адрес Pages. Ни владелец с телефона,
      # ни агент из своего контейнера до hollvpn.ru не достают, и без
      # этого шага «сайт выложен» и «сайт открывается» — разные вещи,
      # которые никто не различит.
      - name: Сайт открывается на домене
        run: |
          domain="$(cat site/CNAME)"
          echo "Домен из site/CNAME: $domain"

          # Код и признак неудачи разделены намеренно. При обрыве curl всё
          # равно печатает %{http_code} — «000», — и если добавить к этому
          # запасное значение через ||, коды склеятся в «000000», после чего
          # ни одно сравнение не сойдётся. Поэтому запасное значение
          # присваивается, а не дописывается.
          probe() {   # адрес [доп. ключи curl] → печатает код
            local url=$1; shift
            local code
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 "$@" "$url" 2>/dev/null) \
              || code=000
            printf '%s' "$code"
          }

          # Сначала DNS, потом HTTP. Если в зоне остались старые записи,
          # домен отвечает двумя адресами вперемешку: часть посетителей
          # попадает на прежний сервер, где стоит чужой сертификат, и
          # браузер показывает «небезопасно». По одному коду ответа это
          # неотличимо от невыпущенного сертификата, а лечится совершенно
          # иначе — поэтому проверяем отдельно и заранее.
          pages_ips='185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153'

          stale_for() {   # имя → печатает посторонние адреса, если они есть
            local host=$1 seen='' ip
            for _ in $(seq 12); do
              for ip in $(dig +short A "$host" 2>/dev/null | grep -E '^[0-9.]+$'); do
                case " $pages_ips " in *" $ip "*) continue ;; esac
                case " $seen "      in *" $ip "*) continue ;; esac
                seen="$seen $ip"
              done
            done
            printf '%s' "$seen"
          }

          stale_apex=$(stale_for "$domain")
          stale_www=$(stale_for "www.$domain")

          if [ -n "$stale_apex" ] || [ -n "$stale_www" ]; then
            echo "::warning::В зоне остались прежние записи — домен отвечает двумя адресами вперемешку."
            [ -n "$stale_apex" ] && echo "  $domain отвечает также:$stale_apex"
            [ -n "$stale_www" ]  && echo "  www.$domain отвечает также:$stale_www"
            echo '  Пока это так, часть посетителей попадает на прежний сервер, где'
            echo '  сертификат выписан на другое имя, — браузер показывает «небезопасно».'
            echo '  И сертификат для домена не выпустится: проверка Let'"'"'s Encrypt тоже'
            echo '  попадает на прежний сервер и не находит там подтверждения.'
            echo '  Лечится только удалением этих записей у регистратора.'
          else
            echo 'DNS: домен отвечает только адресами GitHub Pages.'
          fi

          # http без -L: пока сертификата нет, переход на https оборвётся,
          # и ответ «000» скрыл бы то, что домен на самом деле уже отвечает.
          http_code=$(probe "http://$domain/")
          https_code=$(probe "https://$domain/" -L)
          echo "  http  → $http_code"
          echo "  https → $https_code"

          if [ "$https_code" = 200 ] && grep -qi 'hollvpn' /tmp/body; then
            echo 'Сайт отвечает на домене по HTTPS.'
            exit 0
          fi

          # Разбираем, что именно не готово: у каждой причины свой срок
          # и своё действие, и путать их дороже, чем разобрать.
          case "$http_code:$https_code" in
            200:000|301:000|302:000)
              if [ -n "$stale_apex$stale_www" ]; then
                # Ждать тут нечего: пока старые записи в зоне, выпуск
                # сертификата будет проваливаться сколько угодно раз.
                echo '::warning::HTTPS не появится, пока в зоне остаются прежние записи (см. выше).'
              else
                echo '::notice::Домен отвечает, HTTPS ещё нет — Pages выпускает сертификат.'
                echo 'Это занимает до пятнадцати минут после привязки домена. Делать ничего не нужно.'
              fi
              echo 'Пока сертификата нет, оплата на сайте не пройдёт: Worker пускает'
              echo 'только https-origin. Бот принимает оплату как обычно.'
              ;;
            404:*|*:404)
              echo '::warning::Домен резолвится, но Pages отвечает 404 — домен ему ещё не привязан.'
              echo 'Settings → Pages → Custom domain должен показывать этот домен.'
              ;;
            000:000)
              echo '::warning::Домен не отвечает вовсе — записи ещё не разошлись по резолверам.'
              ;;
            *)
              echo "::warning::Неожиданный ответ: http $http_code, https $https_code."
              head -c 300 /tmp/body || true
              echo
              ;;
          esac

          # Не роняем выкладку: сайт выложен, а привязка домена и
          # сертификат живут своим сроком и на артефакт не влияют.
          echo 'Выкладка прошла; домен проверьте по строкам выше.'
