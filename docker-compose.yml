services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - '5432:5432'
    volumes:
      - wallet-pgdata:/var/lib/postgresql/data
      # Creates the second database the test suite truncates, so tests never
      # touch development data.
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wallet:wallet@db:5432/wallet
      TEST_DATABASE_URL: postgres://wallet:wallet@db:5432/wallet_test
      PORT: 3000
    ports:
      - '3000:3000'
    command: sh -c "npm run migrate:dist && npm run start"

volumes:
  wallet-pgdata:
